name: Indice pollen quotidien

on:
  schedule:
    # Tous les jours à 11 h 17 UTC (12 h 17 à Paris en hiver, 13 h 17 en été),
    # après la publication de l'indice par Atmo France (avant midi).
    - cron: "17 11 * * *"
  workflow_dispatch:   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  pollen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer l'indice pollen
        env:
          ATMO_USERNAME: ${{ secrets.ATMO_USERNAME }}
          ATMO_PASSWORD: ${{ secrets.ATMO_PASSWORD }}
          ATMO_ROUTE: ${{ vars.ATMO_ROUTE }}
          ATMO_DATA_ID: ${{ vars.ATMO_DATA_ID }}
        run: python tools/fetch-pollen.py

      - name: Publier si les données ont changé
        run: |
          git config user.name "pollen-bot"
          git config user.email "pollen-bot@users.noreply.github.com"
          git add data/pollen.json
          git diff --cached --quiet || git commit -m "Indice pollen du $(date -u +%F)"
          git push
