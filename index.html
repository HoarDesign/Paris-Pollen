<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paris Pollens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7EFE3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Paris Pollens">
  <meta name="description" content="Les arbres allergisants de Paris et l'indice pollen Airparif, selon vos allergies.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/MarkerCluster.css">
  <link rel="stylesheet" href="css/app.css?v=10">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#carte" aria-label="Paris Pollens, carte">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F3A00" stroke-width="2.2" stroke-linecap="round"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/></svg>
      </span>
      <span class="brand-name">Paris Pollens</span>
    </a>
    <div class="top-actions">
      <button type="button" class="round-btn" id="btn-search" aria-label="Rechercher une adresse ou une espèce" aria-expanded="false" aria-controls="search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg></button>
      <a class="avatar" id="avatar" href="#profil" aria-label="Mon profil">–</a>
    </div>
  </header>

  <!-- CARTE -->
  <main id="view-carte" class="view" aria-label="Carte">
    <div id="map" role="application" aria-label="Carte des arbres allergisants"></div>
    <div class="loading glass" id="loading">Chargement des arbres…</div>

    <div class="map-ui">
      <div class="map-ui-inner">
        <div class="search" id="search">
          <label class="glass">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5D50" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
            <span class="sr-only">Rechercher une adresse ou une espèce</span>
            <input id="search-input" type="search" placeholder="Adresse ou espèce" autocomplete="off" enterkeyhint="search" aria-controls="search-results">
            <button type="button" class="search-clear" id="search-clear" aria-label="Effacer la recherche">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </label>
          <div class="search-results glass" id="search-results" role="listbox" aria-label="Résultats"></div>
        </div>

      </div>
    </div>

    <div class="map-controls glass">
      <button type="button" id="btn-heat" aria-pressed="false" aria-label="Afficher la densité">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      </button>
      <button type="button" id="btn-filter" aria-label="Filtres" aria-haspopup="menu" aria-expanded="false" aria-controls="filter-menu">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="badge" aria-hidden="true"></span>
      </button>
      <button type="button" id="btn-locate" aria-label="Me localiser">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="#0A84FF" stroke="#0A84FF" stroke-width="1.6" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>
      </button>
    </div>

    <div class="filter-menu glass" id="filter-menu" role="menu" aria-label="Filtrer les arbres" hidden></div>


    <article class="detail" id="detail" aria-label="Fiche arbre" aria-hidden="true"></article>
  </main>

  <!-- ALERTES -->
  <main id="view-alertes" class="view" aria-label="Alertes pollens">
    <div class="scroll"><div class="column" id="alertes-body"></div></div>
  </main>

  <!-- ESPÈCES -->
  <main id="view-especes" class="view" aria-label="Espèces">
    <div class="scroll"><div class="column" id="especes-body"></div></div>
  </main>

  <!-- PROFIL -->
  <main id="view-profil" class="view" aria-label="Profil">
    <div class="scroll"><div class="column" id="profil-body"></div></div>
  </main>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar glass" aria-label="Navigation principale">
    <a href="#carte" data-tab="carte">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Carte</a>
    <a href="#alertes" data-tab="alertes">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Alertes</a>
    <a href="#especes" data-tab="especes">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/></svg>Espèces</a>
    <a href="#profil" data-tab="profil">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="js/leaflet.markercluster.js"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
